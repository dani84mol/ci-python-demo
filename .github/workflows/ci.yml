name: CI & CD Simulado

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      entorno:
        description: "Entorno de despliegue simulado"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - produccion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas y generar reporte
        run: |
          pytest -v --junitxml=test-report.xml

      - name: Subir reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-report.xml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Despliegue simulado
        run: |
          echo "Simulando deploy en el entorno: ${{ github.event.inputs.entorno }}"
          echo "Despliegue completado con éxito."